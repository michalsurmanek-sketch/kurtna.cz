<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Zákaznický účet | Kurtna.cz</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/guide.css">
  <link rel="stylesheet" href="/ucet/account.css">
  <script type="module" src="/ucet/account.js"></script>
</head>
<body>
<header class="bar"><div class="wrap bar-inner">
  <a href="/"><img src="/assets/kurtna-logo.webp" width="540" height="180" alt="Kurtna.cz – úvod"></a>
  <a href="/#produkty">Zpět do katalogu →</a>
</div></header>
<main class="wrap">
  <section class="account-card" aria-labelledby="account-title">
    <h1 id="account-title">Zákaznický účet</h1>
    <p id="account-status" role="status">Registraci připravujeme. Katalog můžete procházet bez účtu.</p>
    <form id="account-form" hidden>
      <label id="email-field">E-mail <input name="email" type="email" autocomplete="email" maxlength="254" required></label>
      <label id="password-field">Heslo <input name="password" type="password" autocomplete="current-password" maxlength="72" required></label>
      <button class="button" type="submit" id="account-submit">Přihlásit se</button>
    </form>
    <div class="account-links" id="account-links" hidden>
      <button type="button" data-mode="register">Vytvořit účet</button>
      <button type="button" data-mode="login">Přihlásit se</button>
      <button type="button" data-mode="reset">Zapomenuté heslo</button>
    </div>
    <div id="account-session" hidden>
      <p>Přihlášený e-mail: <strong id="account-email"></strong></p>
      <button id="account-logout" class="button" type="button">Odhlásit se</button>
    </div>
  </section>
</main>
</body>
</html>
